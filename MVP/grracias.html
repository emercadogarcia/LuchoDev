<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! - Lucho Dev</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .thankyou-card {
            background: white;
            max-width: 550px;
            width: 100%;
            padding: 3rem 2rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2);
        }
        .checkmark {
            width: 80px;
            height: 80px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 3rem;
            color: white;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #0f172a;
        }
        p {
            color: #475569;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn-home {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-home:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="thankyou-card">
        <div class="checkmark">✓</div>
        <h1>¡Gracias por contactarme!</h1>
        <p>He recibido tu mensaje correctamente. En menos de 1 hora estaré revisando tu proyecto y te responderé personalmente.</p>
        <a href="index.html" class="btn-home">Volver al inicio</a>
    </div>
</body>
</html>
